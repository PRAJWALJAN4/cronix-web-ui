spring:
  datasource:
    url: jdbc:sqlite:safeclock.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true

server:
  port: 8080

safeclock:
  jwt:
    secret: SafeClockJwtSecretKeyForHS256SigningMustBe256BitsLong1234567890ABCDEF
    expiration: 86400000  # 24 hours in ms
  otp:
    expiry-minutes: 5
    max-attempts: 3

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:paste_twilio_here}
  auth-token: ${TWILIO_AUTH_TOKEN:paste_twilio_here}
  phone-number: ${TWILIO_PHONE_NUMBER:paste_twilio_here}

logging:
  level:
    com.safeclock: DEBUG
    org.springframework.security: WARN
